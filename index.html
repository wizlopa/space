<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pocket Solar System AR</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; color: #fff; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; text-align: center; padding: 24px; }
  #start .planet { font-size: 64px; animation: spin 4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #start h1 { margin: 0; font-size: 24px; }
  #start p { margin: 0; max-width: 320px; opacity: .8; line-height: 1.45; }
  button { font: inherit; border: 0; border-radius: 999px; padding: 14px 28px; font-size: 17px;
    font-weight: 600; background: #fff; color: #0b1020; }
  #msg { color: #ffb4a8; min-height: 20px; font-size: 14px; }
  #overlay { display: none; position: fixed; inset: 0; pointer-events: none; }
  #overlay.on { display: block; }
  #overlay button { pointer-events: auto; }
  #hint { position: absolute; left: 0; right: 0; top: 0; text-align: center; font-size: 16px;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px 24px;
    background: linear-gradient(rgba(0,0,0,.6), transparent); }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 12px;
    padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 20px); }
  #bar button { background: rgba(255,255,255,.92); padding: 12px 22px; font-size: 15px; }
  #bar #exit { background: rgba(0,0,0,.6); color: #fff; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>

<div id="start">
  <div class="planet">🪐</div>
  <h1>Pocket Solar System AR</h1>
  <p>Move your phone slowly to scan the floor. When the white frame appears, tap to place the solar system.</p>
  <button id="startBtn">Start AR</button>
  <div id="msg"></div>
</div>

<div id="overlay">
  <div id="hint">Move your phone slowly to find the floor…</div>
  <div id="bar">
    <button id="reset">Move</button>
    <button id="exit">Exit</button>
  </div>
</div>

<script type="module">
import * as THREE from "three";

const startBtn = document.getElementById("startBtn");
const msg = document.getElementById("msg");
const overlay = document.getElementById("overlay");
const hint = document.getElementById("hint");

// ---------- Planet data ----------
const BODIES = [
  { n: "Mercury", d: 0.35, r: 0.035, c: 0xa8a29e, o: 4 },
  { n: "Venus",   d: 0.50, r: 0.05,  c: 0xe8c07a, o: 6 },
  { n: "Earth",   d: 0.65, r: 0.055, c: 0x3b82f6, o: 8 },
  { n: "Mars",    d: 0.80, r: 0.04,  c: 0xdc4b2a, o: 11 },
  { n: "Jupiter", d: 1.00, r: 0.11,  c: 0xd9a066, o: 16 },
  { n: "Saturn",  d: 1.25, r: 0.09,  c: 0xe6d39a, o: 21, ring: true }
];

// ---------- Three.js setup ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
renderer.domElement.style.cssText = "position:fixed;inset:0;";
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.2));

// ---------- Reticle (white rounded frame, like a floor placement marker) ----------
function roundedRectShape(w, h, r) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
const outer = roundedRectShape(0.6, 0.6, 0.06);
outer.holes.push(roundedRectShape(0.57, 0.57, 0.045));
const reticleGeo = new THREE.ShapeGeometry(outer);
reticleGeo.rotateX(-Math.PI / 2);
const reticle = new THREE.Mesh(reticleGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide }));
reticle.matrixAutoUpdate = false;
reticle.visible = false;
scene.add(reticle);

// ---------- Solar system ----------
function makeLabel(text) {
  const c = document.createElement("canvas");
  c.width = 256; c.height = 64;
  const g = c.getContext("2d");
  g.font = "bold 36px sans-serif";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.shadowColor = "rgba(0,0,0,.9)"; g.shadowBlur = 8;
  g.fillStyle = "#fff";
  g.fillText(text, 128, 32);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthTest: false }));
  sp.scale.set(0.3, 0.075, 1);
  sp.renderOrder = 10;
  return sp;
}

const system = new THREE.Group();
system.visible = false;
system.scale.setScalar(0.45);
scene.add(system);

const sun = new THREE.Mesh(new THREE.SphereGeometry(0.18, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffb703 }));
const glow = new THREE.Mesh(new THREE.SphereGeometry(0.26, 32, 32), new THREE.MeshBasicMaterial({ color: 0xff8800, transparent: true, opacity: 0.25 }));
sun.add(glow);
const sunLabel = makeLabel("Sun"); sunLabel.position.y = 0.38; sun.add(sunLabel);
system.add(sun);
system.add(new THREE.PointLight(0xffffff, 3, 0, 0));

const pivots = [];
BODIES.forEach(b => {
  const line = new THREE.Mesh(
    new THREE.RingGeometry(b.d - 0.003, b.d + 0.003, 96).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35, side: THREE.DoubleSide })
  );
  system.add(line);

  const pivot = new THREE.Group();
  pivot.rotation.y = Math.random() * Math.PI * 2;
  const holder = new THREE.Group();
  holder.position.x = b.d;
  const planet = new THREE.Mesh(new THREE.SphereGeometry(b.r, 32, 32), new THREE.MeshStandardMaterial({ color: b.c, roughness: 0.9 }));
  holder.add(planet);

  if (b.ring) {
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(b.r * 1.3, b.r * 2.1, 64),
      new THREE.MeshBasicMaterial({ color: 0xcdb77a, side: THREE.DoubleSide, transparent: true, opacity: 0.85 })
    );
    ring.rotation.x = -Math.PI / 2 + 0.35;
    holder.add(ring);
  }
  const label = makeLabel(b.n);
  label.position.y = b.r + 0.07;
  holder.add(label);

  pivot.add(holder);
  system.add(pivot);
  pivots.push({ pivot, planet, speed: (Math.PI * 2) / b.o });
});

// ---------- AR session logic ----------
let session = null;
let hitSource = null;
let hitRequested = false;
let placed = false;

function showHint(t) { hint.textContent = t; }

function onSelect() {
  if (!placed && reticle.visible) {
    system.position.setFromMatrixPosition(reticle.matrix);
    system.position.y += 0.4;           // float above the floor
    system.visible = true;
    reticle.visible = false;
    placed = true;
    showHint("Placed! Walk around to explore. Tap Move to re-place.");
  }
}
const controller = renderer.xr.getController(0);
controller.addEventListener("select", onSelect);
scene.add(controller);

document.getElementById("reset").addEventListener("click", () => {
  placed = false;
  system.visible = false;
  showHint("Point at the floor and tap to place");
});
document.getElementById("exit").addEventListener("click", () => session && session.end());
["reset", "exit"].forEach(id =>
  document.getElementById(id).addEventListener("beforexrselect", e => e.preventDefault())
);

async function checkSupport() {
  if (!navigator.xr) {
    startBtn.disabled = true;
    msg.textContent = "WebXR is not available here. Open this link in Chrome on an ARCore-supported Android phone (HTTPS required).";
    return;
  }
  try {
    const ok = await navigator.xr.isSessionSupported("immersive-ar");
    if (!ok) {
      startBtn.disabled = true;
      msg.textContent = "This device/browser does not support AR. Try Chrome on an ARCore-supported Android phone.";
    }
  } catch (e) {
    msg.textContent = "Could not check AR support.";
  }
}
checkSupport();

startBtn.addEventListener("click", async () => {
  try {
    session = await navigator.xr.requestSession("immersive-ar", {
      requiredFeatures: ["hit-test"],
      optionalFeatures: ["dom-overlay", "local-floor"],
      domOverlay: { root: overlay }
    });
  } catch (e) {
    msg.textContent = "Could not start AR: " + e.message;
    return;
  }
  renderer.xr.setReferenceSpaceType("local");
  await renderer.xr.setSession(session);
  document.getElementById("start").style.display = "none";
  overlay.classList.add("on");
  renderer.domElement.style.display = "block";
  placed = false;
  system.visible = false;
  showHint("Move your phone slowly to find the floor…");

  session.addEventListener("end", () => {
    session = null; hitSource = null; hitRequested = false;
    overlay.classList.remove("on");
    document.getElementById("start").style.display = "flex";
    reticle.visible = false; system.visible = false; placed = false;
  });
});

// ---------- Render loop ----------
const clock = new THREE.Clock();
renderer.setAnimationLoop((time, frame) => {
  const dt = clock.getDelta();

  if (frame && session) {
    if (!hitRequested) {
      hitRequested = true;
      session.requestReferenceSpace("viewer").then(vs =>
        session.requestHitTestSource({ space: vs }).then(src => { hitSource = src; })
      );
    }
    if (hitSource && !placed) {
      const hits = frame.getHitTestResults(hitSource);
      if (hits.length) {
        const pose = hits[0].getPose(renderer.xr.getReferenceSpace());
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);
        showHint("Floor found – tap to place the solar system");
      } else {
        reticle.visible = false;
        showHint("Move your phone slowly to find the floor…");
      }
    }
  }

  if (system.visible) {
    sun.rotation.y += dt * 0.2;
    pivots.forEach(p => { p.pivot.rotation.y += dt * p.speed; p.planet.rotation.y += dt * 1.5; });
  }
  renderer.render(scene, camera);
});

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
